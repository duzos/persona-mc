name: Publish (Modrinth + CurseForge)

on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  fabric:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Read versions
        id: versions
        shell: bash
        run: |
          MV=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2-)
          MCV=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2-)
          echo "mod_version=$MV" >> "$GITHUB_OUTPUT"
          echo "mc_version=$MCV" >> "$GITHUB_OUTPUT"

      - name: Data Generation
        run: ./gradlew runDatagen
        continue-on-error: true

      - name: Build
        run: ./gradlew build

      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          changelog-file: CHANGELOG.md
          # TODO: set curseforge-id to the numeric CurseForge Project ID (from the project dashboard) before publishing.
          curseforge-id: 0
          curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"
          modrinth-id: personas
          modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"

          version: ${{ steps.versions.outputs.mod_version }}-${{ steps.versions.outputs.mc_version }}-fabric
          name: Persona ${{ steps.versions.outputs.mod_version }} (${{ steps.versions.outputs.mc_version }} Fabric)

          github-generate-changelog: true
          version-type: release

          loaders: fabric
          java: 17
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
